name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    name: Build and audit (${{ matrix.sample }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample:
          - azureDevOpsApp/polling
          - azureDevOpsApp/webhook
          - azureblobApp/polling
          - azureblobApp/webhook
          - dataflowsApp/webhook
          - dataverseApp/polling
          - dataverseApp/webhook
          - genericApp/polling
          - genericApp/webhook
          - office365App/polling
          - office365App/webhook
          - onedriveApp/polling
          - onedriveApp/webhook
          - plannerApp/polling
          - plannerApp/webhook
          - salesforceApp/polling
          - salesforceApp/webhook
          - sharepointApp/polling
          - sharepointApp/webhook
          - teamsApp/polling
          - teamsApp/webhook
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit
      - name: Build and typecheck
        run: npm run build
      - name: Audit dependencies
        if: ${{ success() || failure() }}
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (current source)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      # Scans a snapshot of tracked files at HEAD only, not Git history or ignored local settings.
      - name: Scan current tracked source
        run: |
          snapshot="$RUNNER_TEMP/source-snapshot"
          mkdir -p "$snapshot"
          git archive --format=tar HEAD | tar -xf - -C "$snapshot"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$snapshot" --redact --no-banner