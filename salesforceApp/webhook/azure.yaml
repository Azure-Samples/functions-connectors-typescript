# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: salesforceapp-webhook
metadata:
    template: functions-connectors-typescript@1.0.0
services:
    api:
        project: .
        language: ts
        host: function
workflows:
    up:
        - azd: package --all
        - azd: provision
        - azd: deploy --all
hooks:
    prepackage:
        windows:
            shell: pwsh
            run: |
                npm install
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                npm run build
        posix:
            shell: sh
            run: npm install && npm run build
    postdeploy:
        windows:
            shell: pwsh
            run: node ./infra/scripts/postdeploy.mjs
            interactive: true
            continueOnError: false
        posix:
            shell: sh
            run: node ./infra/scripts/postdeploy.mjs
            interactive: true
            continueOnError: false
